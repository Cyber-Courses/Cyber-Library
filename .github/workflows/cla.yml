name: Contributor License Agreement
# Asks first-time contributors to accept CLA.md with a comment, and records signatures on the
# cla-signatures branch (not main, so no site deploy is triggered). Uses the repo's own token.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read and agree to the Cyber Library Contributor License Agreement') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/v1/cla.json'
          path-to-document: 'https://github.com/Cyber-Courses/Cyber-Library/blob/main/CLA.md'
          branch: 'cla-signatures'
          create-file-commit-message: 'CLA: create the signature file'
          signed-commit-message: 'CLA: $contributorName has signed'
          custom-notsigned-prcomment: 'Thanks for contributing to the Cyber Library. Before we can merge, please read the [Contributor License Agreement](https://github.com/Cyber-Courses/Cyber-Library/blob/main/CLA.md) and reply to this comment with the sentence below.'
          custom-pr-sign-comment: 'I have read and agree to the Cyber Library Contributor License Agreement'
          custom-allsigned-prcomment: 'All contributors have signed the Contributor License Agreement. Thank you.'
          lock-pullrequest-aftermerge: false
