<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" role="img" aria-label="Cyber Library: a community-maintained knowledge base for cybersecurity">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c100e"/>
      <stop offset="1" stop-color="#070908"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.55" stop-color="#34d399" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4ef"/>
      <stop offset="1" stop-color="#c9cec6"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1b241f" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.25" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#grid)"/>
  <rect width="1280" height="340" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="3" fill="url(#accent)"/>

  <!-- monogram: bracketed shield -->
  <g transform="translate(96,118)">
    <rect x="-28" y="-28" width="104" height="104" rx="18" fill="#0f1613" stroke="#223029" stroke-width="1.5"/>
    <path d="M24 -6 L48 4 V22 C48 40 36 50 24 56 C12 50 0 40 0 22 V4 Z" fill="none" stroke="#34d399" stroke-width="3" stroke-linejoin="round"/>
    <path d="M12 22 l9 9 l15 -19" fill="none" stroke="#f4f4ef" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <text x="210" y="150" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="2" fill="url(#title)">Cyber Library</text>
  <text x="212" y="196" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="21" letter-spacing="1" fill="#8aa398">A community-maintained knowledge base for cybersecurity.</text>

  <!-- accent underline -->
  <rect x="212" y="216" width="150" height="2.5" fill="#34d399"/>

  <!-- pillar chips -->
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="17" letter-spacing="0.5">
    <text x="212" y="270" fill="#6f8278">Foundation</text>
    <text x="330" y="270" fill="#3b463f">/</text>
    <text x="350" y="270" fill="#d6ddd4">Offensive</text>
    <text x="456" y="270" fill="#3b463f">/</text>
    <text x="476" y="270" fill="#6f8278">Defensive</text>
    <text x="586" y="270" fill="#3b463f">/</text>
    <text x="606" y="270" fill="#6f8278">Intelligence</text>
    <text x="742" y="270" fill="#3b463f">/</text>
    <text x="762" y="270" fill="#6f8278">Governance</text>
    <text x="892" y="270" fill="#3b463f">/</text>
    <text x="912" y="270" fill="#6f8278">Career</text>
  </g>

  <!-- right-side terminal motif -->
  <g transform="translate(980,96)" font-family="'SFMono-Regular', Consolas, monospace" font-size="16">
    <rect x="0" y="0" width="236" height="148" rx="12" fill="#0a0f0d" stroke="#1d2721" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="4" fill="#2b352e"/>
    <circle cx="36" cy="20" r="4" fill="#2b352e"/>
    <circle cx="52" cy="20" r="4" fill="#2b352e"/>
    <text x="20" y="62" fill="#5f7268">$ cyber</text><text x="92" y="62" fill="#34d399">library</text>
    <text x="20" y="90" fill="#8aa398">&#8227; offensive/injection</text>
    <text x="20" y="116" fill="#8aa398">&#8227; defensive/forensics</text>
  </g>
</svg>
