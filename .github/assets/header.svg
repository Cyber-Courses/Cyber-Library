<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" role="img" aria-label="Cyber Library: learn cybersecurity, from the foundations up.">
  <defs>
    <linearGradient id="title" gradientUnits="userSpaceOnUse" x1="0" y1="110" x2="0" y2="270">
      <stop offset="0" stop-color="#f7f7f7"/>
      <stop offset="1" stop-color="#5f5f5f"/>
    </linearGradient>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#101010" stroke-width="1"/>
    </pattern>
    <linearGradient id="hatchfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="1"/>
    </linearGradient>
    <style>.g{font-family:Geist,"Geist Fallback",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}</style>
  </defs>

  <rect width="1280" height="440" fill="#000"/>
  <rect width="1280" height="230" fill="url(#hatch)"/>
  <rect width="1280" height="230" fill="url(#hatchfade)"/>

  <!-- badge pill -->
  <g class="g" font-size="14.5">
    <rect x="463.5" y="54.5" width="353" height="33" rx="8" fill="#0a0a0a" stroke="#262626"/>
    <text x="640" y="76" text-anchor="middle"><tspan fill="#ededed">Open source</tspan><tspan fill="#3a3a3a">&#160;&#160;·&#160;&#160;</tspan><tspan fill="#9b9b9b">136+ pages, 70 languages</tspan></text>
  </g>

  <!-- hero title (two lines, gradient fade) -->
  <g class="g" font-weight="600" letter-spacing="-3" text-anchor="middle" fill="url(#title)">
    <text x="640" y="176" font-size="74">Learn cybersecurity,</text>
    <text x="640" y="248" font-size="74">from the foundations up.</text>
  </g>

  <!-- tagline -->
  <g class="g" font-size="18" fill="#9b9b9b" text-anchor="middle">
    <text x="640" y="300">A community-maintained, structured knowledge base. Foundations, offensive and defensive practice,</text>
    <text x="640" y="326">governance, intelligence and career guidance, in one coherent tree, free and open.</text>
  </g>

  <!-- buttons -->
  <g class="g" font-size="15" font-weight="500" text-anchor="middle">
    <rect x="424" y="366" width="236" height="42" rx="6" fill="#ededed"/>
    <text x="542" y="393" fill="#0a0a0a">Start with the foundations</text>
    <rect x="672" y="366" width="184" height="42" rx="6" fill="none" stroke="#262626"/>
    <text x="764" y="393" fill="#ededed">Tour the navigation</text>
  </g>
</svg>
