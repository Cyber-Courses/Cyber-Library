name: Translation issue
description: Report a missing, incorrect, or outdated translation.
title: "[i18n]: "
labels: ["translation"]
body:
  - type: input
    id: locale
    attributes:
      label: Locale
      description: ISO 639-1 code (e.g. fr, de, es, ja).
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page path
      description: The English path, mirrored under i18n/<locale>/.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Type
      options:
        - Missing translation
        - Incorrect translation
        - Outdated versus the English source
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What is wrong, and the suggested wording if you have it.
    validations:
      required: true
