name: Wiki / documentation request
description: Request new or improved project documentation (the contributor wiki).
title: "[wiki]: "
labels: ["wiki", "request"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Type
      options:
        - New wiki page
        - Improve an existing wiki page
        - Fix an error in the wiki
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Wiki page (if about an existing one)
      description: Title or URL of the wiki page.
  - type: textarea
    id: details
    attributes:
      label: What's needed
      description: Describe the documentation you need or the change to make.
    validations:
      required: true
