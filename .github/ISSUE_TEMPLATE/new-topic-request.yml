name: New topic / content request
description: Propose a new page or topic to add to the library.
title: "[request]: "
labels: ["content", "request", "new"]
body:
  - type: input
    id: topic
    attributes:
      label: Proposed title
    validations:
      required: true
  - type: dropdown
    id: pillar
    attributes:
      label: Pillar
      options:
        - Foundation
        - Offensive
        - Defensive
        - Intelligence
        - Governance
        - Career
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Where in the taxonomy
      description: The parent path this should live under, if you know it.
  - type: textarea
    id: why
    attributes:
      label: Why it's valuable
      description: Who is the audience and what will they learn?
    validations:
      required: true
  - type: textarea
    id: outline
    attributes:
      label: Proposed outline
      description: Sections or subtopics it should cover.
  - type: textarea
    id: refs
    attributes:
      label: References
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and pages and this isn't a duplicate.
          required: true
