name: Content correction or improvement
description: Report an error, outdated information, or something unclear on an existing page.
title: "[content]: "
labels: ["content", "improvement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for improving the library. Note: offensive pages are **exploitation + explanation only** — detection and mitigation live in the defensive section.
  - type: input
    id: page
    attributes:
      label: Page path or URL
      description: The file path or the published URL of the page.
      placeholder: offensive/software/applications/server/web/code/injection/...
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Type of issue
      options:
        - Technical inaccuracy
        - Outdated information
        - Unclear / hard to follow
        - Broken or non-working example or payload
        - Broken link
        - Typo / grammar
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong
      description: Describe the problem clearly. Quote the exact text where possible.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
      description: How should it read instead?
  - type: textarea
    id: sources
    attributes:
      label: Sources / references
      description: Links that back up the correction (RFCs, vendor docs, CVEs, research).
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
